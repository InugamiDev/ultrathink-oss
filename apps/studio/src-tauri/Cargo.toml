[package]
name = "ultrathink-studio"
version = "0.1.0"
description = "UltraThink Studio — desktop app for building software with Claude Code + UltraThink skills + memory."
authors = ["InuVerse"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ultrathink_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
once_cell = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
# OS-native secret storage. macOS: Keychain; Windows: Credential Manager;
# Linux: Secret Service (gnome-keyring/kwallet). Falls back to a file vault if
# none is available — explicit error surfaced to the UI rather than plain disk.
keyring = "3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
